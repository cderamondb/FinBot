<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente Financiero IA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo h1 {
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .logo p {
            font-size: 12px;
            color: #94a3b8;
        }

        .btn-reset {
            background: #1e293b;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: #334155;
            color: #e2e8f0;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #1e293b;
            border: 1px solid #334155;
            border-bottom-left-radius: 4px;
        }

        .message.assistant h1,
        .message.assistant h2,
        .message.assistant h3 {
            color: #60a5fa;
            margin: 12px 0 6px 0;
            font-size: 15px;
        }

        .message.assistant h1:first-child,
        .message.assistant h2:first-child,
        .message.assistant h3:first-child {
            margin-top: 0;
        }

        .message.assistant ul, .message.assistant ol {
            padding-left: 20px;
            margin: 6px 0;
        }

        .message.assistant li { margin: 4px 0; }

        .message.assistant strong { color: #93c5fd; }

        .message.assistant table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 13px;
        }

        .message.assistant th, .message.assistant td {
            border: 1px solid #334155;
            padding: 8px 10px;
            text-align: left;
        }

        .message.assistant th {
            background: #334155;
            color: #93c5fd;
        }

        .message.assistant code {
            background: #334155;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .message.assistant hr {
            border: none;
            border-top: 1px solid #334155;
            margin: 12px 0;
        }

        .typing {
            align-self: flex-start;
            padding: 14px 18px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: none;
        }

        .typing .dots {
            display: flex;
            gap: 4px;
        }

        .typing .dot {
            width: 8px;
            height: 8px;
            background: #64748b;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .input-area {
            padding: 16px 24px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        #userInput {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        #userInput:focus { border-color: #3b82f6; }

        #userInput::placeholder { color: #64748b; }

        .btn-send {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .btn-send:hover { opacity: 0.9; }
        .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .welcome h2 {
            color: #e2e8f0;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .welcome p { font-size: 14px; margin-bottom: 20px; }

        .suggestions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .suggestion {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .suggestion:hover {
            background: #334155;
            color: #e2e8f0;
            border-color: #3b82f6;
        }

        @media (max-width: 768px) {
            .message { max-width: 95%; }
            .suggestions { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">$</div>
            <div>
                <h1>Agente Financiero IA</h1>
                <p>Caso de negocio para productos de IA</p>
            </div>
        </div>
        <button class="btn-reset" onclick="resetChat()">Nueva consulta</button>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcome">
            <h2>Bienvenido al Agente Financiero</h2>
            <p>Te ayudo a construir el caso de negocio completo para tu producto de IA.</p>
            <div class="suggestions">
                <div class="suggestion" onclick="sendSuggestion('Quiero crear un chatbot de atencion al cliente con IA para mi empresa de retail')">Chatbot de atencion al cliente</div>
                <div class="suggestion" onclick="sendSuggestion('Necesito un sistema de prediccion de demanda con IA para mi cadena de supermercados')">Prediccion de demanda</div>
                <div class="suggestion" onclick="sendSuggestion('Quiero desarrollar un asistente medico con IA para diagnostico inicial')">Asistente medico IA</div>
            </div>
        </div>
        <div class="typing" id="typing">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Describe tu proyecto de IA..." onkeydown="if(event.key==='Enter')sendMessage()">
            <button class="btn-send" id="btnSend" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        const sessionId = 'session_' + Date.now();
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const btnSend = document.getElementById('btnSend');
        const typing = document.getElementById('typing');
        const welcome = document.getElementById('welcome');

        function addMessage(text, role) {
            if (welcome) welcome.style.display = 'none';

            const div = document.createElement('div');
            div.className = `message ${role}`;

            if (role === 'assistant') {
                div.innerHTML = renderMarkdown(text);
            } else {
                div.textContent = text;
            }

            chatContainer.insertBefore(div, typing);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function renderMarkdown(text) {
            let html = text
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code>$1</code>')
                .replace(/^---$/gm, '<hr>')
                .replace(/^\- (.+)$/gm, '<li>$1</li>')
                .replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

            html = html.replace(/((<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

            html = html.replace(/\|(.+)\|\n\|[-| ]+\|\n((\|.+\|\n?)+)/g, function(match, headerRow, bodyRows) {
                const headers = headerRow.split('|').filter(h => h.trim());
                const rows = bodyRows.trim().split('\n');
                let table = '<table><thead><tr>';
                headers.forEach(h => table += `<th>${h.trim()}</th>`);
                table += '</tr></thead><tbody>';
                rows.forEach(row => {
                    const cells = row.split('|').filter(c => c.trim());
                    table += '<tr>';
                    cells.forEach(c => table += `<td>${c.trim()}</td>`);
                    table += '</tr>';
                });
                table += '</tbody></table>';
                return table;
            });

            html = html.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
            return html;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            btnSend.disabled = true;
            typing.style.display = 'block';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: text })
                });
                const data = await res.json();
                addMessage(data.response, 'assistant');
            } catch (err) {
                addMessage('Error de conexion. Intenta de nuevo.', 'assistant');
            }

            typing.style.display = 'none';
            btnSend.disabled = false;
            userInput.focus();
        }

        function sendSuggestion(text) {
            userInput.value = text;
            sendMessage();
        }

        async function resetChat() {
            try {
                await fetch('/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: '' })
                });
            } catch (e) {}

            const messages = chatContainer.querySelectorAll('.message');
            messages.forEach(m => m.remove());
            if (welcome) welcome.style.display = 'block';
        }

        userInput.focus();
    </script>
</body>
</html>
